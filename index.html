<!DOCTYPE html>
<!--
  بيكسل ستوديو — محرر صور بفكرة فوتوشوب، كود أصلي 100% (HTML/CSS/JS خالص، من غير مكتبات خارجية).
  التشغيل: احفظ الملف ده باسم pixel-studio.html وافتحه في أي متصفح حديث، هيشتغل على طول.
  الملف ده هو البرنامج وهو الكود المصدري الكامل في نفس الوقت.
  اختبارات آلية: افتحه كـ pixel-studio.html?test=1 — مشهد تجريبي: pixel-studio.html?demo=1
-->

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيكسل ستوديو — محرر صور</title>
<style>
/* بيكسل ستوديو — ستايل الواجهة */
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #17181c;
  --panel: #212228;
  --panel2: #2a2b33;
  --border: #3a3b45;
  --text: #e8e8ec;
  --muted: #9a9aa5;
  --accent: #4f7cff;
  --accent2: #7aa0ff;
  --success: #2f9e6e;
  --danger: #d05454;
  --warning: #d9a13b;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

.hidden { display: none !important; }

/* الشريط العلوي */
#topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
.brand { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
.brand span { color: var(--accent2); }
.top-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
#zoomLabel { min-width: 44px; text-align: center; color: var(--muted); font-size: 13px; }

.btn {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: background .15s, border-color .15s;
}
.btn:hover { background: #343642; border-color: #4a4b58; }
.btn.primary { background: var(--accent); border-color: var(--accent); }
.btn.primary:hover { background: var(--accent2); }
.btn.success { background: var(--success); border-color: var(--success); }
.btn.success:hover { filter: brightness(1.1); }
.btn.danger { color: #ffb0b0; }
.btn.warning { background: var(--warning); border-color: var(--warning); color: #1c1c1c; font-weight: 700; }
.btn.small { padding: 4px 8px; font-size: 12px; }
.btn:disabled { opacity: .4; cursor: default; }

/* التخطيط الرئيسي: الأدوات شمال واللوحات يمين زي فوتوشوب */
#main { display: flex; flex: 1 1 auto; min-height: 0; direction: ltr; }
#main > * { direction: rtl; }

/* شريط الأدوات */
#toolbar {
  flex: 0 0 74px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px 6px;
  overflow-y: auto;
}
.tool {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 10px;
  color: var(--text);
  font-size: 20px;
  padding: 7px 2px 5px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.tool small { font-size: 10px; color: var(--muted); }
.tool:hover { background: var(--panel2); }
.tool.active { background: var(--accent); border-color: var(--accent); }
.tool.active small { color: #eaf0ff; }

/* منطقة العمل */
#workspace { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }

#optionsbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 7px 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  flex-wrap: wrap;
}
#optionsbar label { display: flex; align-items: center; gap: 7px; color: var(--muted); }
#optionsbar input[type="range"] { width: 110px; accent-color: var(--accent); }
#optionsbar input[type="color"] {
  width: 34px; height: 28px; border: 1px solid var(--border);
  border-radius: 6px; background: var(--panel2); cursor: pointer; padding: 1px;
}
.doc-info { margin-inline-start: auto; color: var(--muted); font-size: 12px; }
#selHint { color: var(--warning); font-size: 12px; }
.blend-select {
  flex: 1 1 auto; background: var(--panel2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px;
  font-family: inherit; font-size: 12px;
}

#canvasScroll {
  flex: 1 1 auto;
  overflow: auto;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 50% 40%, #1d1e24 0%, var(--bg) 70%);
  padding: 24px;
}
#canvasHolder { position: relative; line-height: 0; }
#canvas {
  background:
    repeating-conic-gradient(#2c2d34 0% 25%, #23242a 0% 50%) 0 0 / 20px 20px;
  box-shadow: 0 8px 40px rgba(0,0,0,.55);
  cursor: crosshair;
}

#cropOverlay {
  position: absolute;
  border: 2px dashed var(--warning);
  background: rgba(217,161,59,.15);
  pointer-events: none;
  line-height: 0;
}
#textOverlay {
  position: absolute;
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 15px;
  z-index: 5;
  min-width: 160px;
}

/* اللوحة الجانبية */
#sidepanel {
  flex: 0 0 252px;
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.panel { padding: 12px; border-bottom: 1px solid var(--border); }
.panel-title { font-weight: 700; font-size: 14px; margin-bottom: 10px; }
.panel-title small { color: var(--muted); font-weight: 400; font-size: 11px; }

.layer-actions { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }

#layerList { list-style: none; display: flex; flex-direction: column; gap: 5px; }
.layer-item {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 9px;
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  font-size: 13px;
}
.layer-item.active { border-color: var(--accent); background: #2b3350; }
.layer-item .thumb {
  width: 34px; height: 26px; border-radius: 4px; flex: 0 0 auto;
  background: repeating-conic-gradient(#3a3b45 0% 25%, #2a2b33 0% 50%) 0 0 / 10px 10px;
  overflow: hidden; display: grid; place-items: center;
}
.layer-item .thumb canvas { max-width: 34px; max-height: 26px; }
.layer-item .name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-item .icon-btn {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 14px; padding: 2px;
}
.layer-item .icon-btn:hover { color: var(--text); }
.layer-item input[type="range"] { width: 52px; accent-color: var(--accent); }

.slider { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.slider input { flex: 1 1 auto; accent-color: var(--accent); }
.slider span { min-width: 28px; text-align: center; color: var(--text); }

.filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.filter-actions { display: flex; gap: 6px; margin-top: 10px; }

#testResults { position: fixed; bottom: 0; left: 0; right: 0; background: #000; color: #0f0; font: 12px monospace; padding: 8px; z-index: 99; white-space: pre-wrap; direction: ltr; }

/* ===== إضافات النسخة الموسّعة ===== */
#menubar { display: flex; gap: 2px; padding: 2px 10px; background: #1b1c21; border-bottom: 1px solid var(--border); flex: 0 0 auto; direction: rtl; position: relative; z-index: 30; }
.menu { position: relative; }
.menu-btn { background: transparent; border: 0; color: var(--text); font-family: inherit; font-size: 13px; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
.menu-btn:hover, .menu.open .menu-btn { background: var(--panel2); }
.menu-dd { display: none; position: absolute; top: 100%; right: 0; min-width: 230px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-height: 80vh; overflow-y: auto; }
.menu.open .menu-dd { display: block; }
.menu-item { display: flex; justify-content: space-between; gap: 18px; width: 100%; background: transparent; border: 0; color: var(--text); font-family: inherit; font-size: 13px; padding: 6px 10px; border-radius: 5px; cursor: pointer; text-align: right; }
.menu-item:hover { background: var(--accent); }
.menu-item kbd { direction: ltr; color: var(--muted); font-size: 11px; font-family: inherit; }
.menu-item:hover kbd { color: #dfe8ff; }
.menu-sep { height: 1px; background: var(--border); margin: 4px 2px; }

#toolbar { flex: 0 0 96px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 6px 5px; align-content: start; overflow-y: auto; }
.tool { padding: 5px 1px 3px; font-size: 18px; }
.tool small { font-size: 9px; }
.tool-sep { grid-column: 1 / -1; height: 1px; background: var(--border); margin: 2px 4px; }
#fgbg { grid-column: 1 / -1; position: relative; height: 54px; margin-top: 6px; direction: ltr; }
#fgbg .sw { position: absolute; width: 30px; height: 30px; border: 2px solid #ddd; border-radius: 4px; cursor: pointer; padding: 0; }
#fgSwatch { left: 8px; top: 4px; z-index: 2; background: #e63946; }
#bgSwatch { left: 26px; top: 20px; background: #fff; border-color: #888; }
#fgbg .mini { position: absolute; right: 6px; top: 4px; background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-size: 11px; width: 24px; height: 20px; cursor: pointer; padding: 0; }
#fgbg .mini.b { top: 28px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
#optionsbar select, .dlg select { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; font-family: inherit; font-size: 12px; }
#toolHint { color: var(--muted); font-size: 12px; }
#brushCursor { position: fixed; display: none; border: 1px solid #fff; box-shadow: 0 0 0 1px #000; border-radius: 50%; pointer-events: none; z-index: 20; }
.mini-info { font: 11px/1.4 monospace; color: var(--muted); direction: ltr; text-align: left; margin-top: 6px; }
#histCanvas { width: 100%; height: 64px; border-radius: 6px; display: block; }
.swatches { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.swatch { aspect-ratio: 1; border: 1px solid #0006; border-radius: 3px; cursor: pointer; padding: 0; }
.swatch:hover { outline: 2px solid var(--accent2); }
#toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: #000d; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; opacity: 0; transition: .25s; z-index: 200; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%); }
#dlgBack { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 100; }
.dlg { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; min-width: 340px; max-width: 92vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.dlg-title { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
.dlg-note { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.dlg-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; }
.dlg-row > span { flex: 0 0 110px; color: var(--muted); }
.dlg-row input[type=range] { flex: 1; accent-color: var(--accent); }
.dlg-row output { min-width: 38px; text-align: center; }
.dlg-btns { display: flex; gap: 8px; justify-content: flex-start; margin-top: 14px; }
.dlg-custom { margin: 8px 0; }
.dlg-custom canvas { width: 256px; height: auto; border-radius: 6px; display: block; max-width: 100%; }
.curve-canvas { height: 256px; cursor: crosshair; touch-action: none; }

#canvas{touch-action:none} #canvasScroll{direction:ltr;place-items:safe center} #sidepanel{flex-basis:286px} .brand{white-space:nowrap} #testResults{max-height:70vh;overflow:auto}
@media(max-width:800px){html{overflow:auto;direction:ltr} body{position:absolute;left:0;top:0;direction:rtl;width:1100px;min-width:1100px;height:900px;min-height:100vh;overflow:hidden} #topbar{flex-wrap:nowrap} #topbar .btn{padding:7px 8px} #sidepanel{flex-basis:270px} #menubar{position:relative}} </style>
</head>
<body>

<header id="topbar">
  <div class="brand">بيكسل <span>ستوديو</span></div>
  <div class="top-actions">
    <button id="btnOpen" class="btn primary" title="فتح صورة من جهازك">📂 فتح صورة</button>
    <button id="btnNew" class="btn" title="مستند جديد فاضي">🗒 مستند جديد</button>
    <span class="sep"></span>
    <button id="btnSaveProj" class="btn">💾 حفظ مشروع</button>
    <button id="btnUndo" class="btn" title="تراجع (Ctrl+Z)">↩ تراجع</button>
    <button id="btnRedo" class="btn" title="إعادة (Ctrl+Y)">↪ إعادة</button>
    <span class="sep"></span>
    <button id="btnZoomOut" class="btn" title="تصغير">−</button>
    <span id="zoomLabel">100%</span>
    <button id="btnZoomIn" class="btn" title="تكبير">+</button>
    <button id="btnZoomFit" class="btn" title="ملاءمة الشاشة">ملاءمة</button>
    <span class="sep"></span>
    <button id="btnExportPng" class="btn success" title="تنزيل الصورة PNG">⬇ PNG</button>
    <button id="btnExportJpg" class="btn success" title="تنزيل الصورة JPG">⬇ JPG</button>
  </div>
</header>

<nav id="menubar"></nav>
<div id="main">

  <!-- شريط الأدوات: شمال زي فوتوشوب -->
  <aside id="toolbar">
    <button class="tool active" data-tool="move"    title="تحريك الطبقات (V)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M2 12h20M8 6l4-4 4 4M8 18l4 4 4-4M6 8l-4 4 4 4M18 8l4 4-4 4"/></svg><small>تحريك</small></button>
    <button class="tool" data-tool="select"  title="تحديد مستطيل (M) — Shift يضيف، Alt يطرح"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 3h18v18H3z"/></svg><small>مستطيل</small></button>
    <button class="tool" data-tool="esel"    title="تحديد بيضاوي (Q)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 7 0 1 1-18 0 9 7 0 1 1 18 0"/></svg><small>بيضاوي</small></button>
    <button class="tool" data-tool="lasso"   title="تحديد حر Lasso (L)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M11 17c-12 0-11-13 0-13 13 0 12 13 1 13-5 0-4-5-1-5 5 0 5 11-1 10"/></svg><small>حر</small></button>
    <button class="tool" data-tool="poly"    title="تحديد مضلع (P)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 4l17 3-2 14-14-3z"/></svg><small>مضلع</small></button>
    <button class="tool" data-tool="wand"    title="العصا السحرية (W)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 21L17 7M15 2v4M12 4h6M20 10v5M18 13h5"/></svg><small>عصا</small></button>
    <button class="tool" data-tool="crop"    title="قص الصورة (C)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M6 2v16h16M2 6h16v16"/></svg><small>قص</small></button>
    <button class="tool" data-tool="picker"  title="قطارة (I) — Alt للخلفية"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 16L17 3l4 4L8 20H4zM12 6l6 6"/></svg><small>قطارة</small></button>
    <span class="tool-sep"></span>
    <button class="tool" data-tool="heal"    title="ترميم مبسّط (J)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 15L15 4c5-5 10 0 5 5L9 20c-5 5-10 0-5-5zM8 10l6 6M11 7l6 6"/></svg><small>ترميم</small></button>
    <button class="tool" data-tool="brush"   title="فرشاة (B)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M8 16L18 3l4 4L9 18M8 16c-6-3-1 5-7 6 6 2 11-1 7-6"/></svg><small>فرشاة</small></button>
    <button class="tool" data-tool="pencil"  title="قلم رصاص حاد (N)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 21l2-7L18 1l5 5L10 19zM5 14l5 5"/></svg><small>قلم</small></button>
    <button class="tool" data-tool="airbrush" title="إيربراش ناعم بشفافية (A)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 15l10-5 3 6-11 4zM10 8v-4h5v4M18 9h3M19 5h3M20 14h3"/></svg><small>إيربراش</small></button>
    <button class="tool" data-tool="clone"   title="ختم النسخ Clone Stamp (S) — Alt+كليك للمصدر"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 20v-5h16v5zM8 14v-3l2-3V4h4v4l2 3v3M2 23h20"/></svg><small>ختم</small></button>
    <button class="tool" data-tool="eraser"  title="ممحاة (E)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M2 15L15 2l8 8-11 11H8zM8 9l9 9M12 21h11"/></svg><small>ممحاة</small></button>
    <span class="tool-sep"></span>
    <button class="tool" data-tool="smudge"  title="سمج Smudge (K)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M8 20L3 13l3-2 4 4V3h3v9-7h3v8-6h3v8l-3 6H8z"/></svg><small>سمج</small></button>
    <button class="tool" data-tool="blurtool" title="تمويه موضعي (R)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 2C9 7 4 12 4 16a8 7 0 0 0 16 0C20 12 15 7 12 2z"/></svg><small>تمويه</small></button>
    <button class="tool" data-tool="sharpentool" title="شحذ موضعي"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 3l10 18H2zM12 9v9"/></svg><small>شحذ</small></button>

<script>
/* بيكسل ستوديو — الفلاتر وتعديلات الألوان (كود أصلي) */
(function () {
  "use strict";

  const clamp = (v) => (v < 0 ? 0 : v > 255 ? 255 : v);

  /* تعديل السطوع / التباين / التشبع على ImageData وإرجاع نسخة جديدة */
  function adjust(src, brightness, contrast, saturation) {
    const out = new ImageData(new Uint8ClampedArray(src.data), src.width, src.height);
    const d = out.data;
    const b = brightness * 2.55;                       // ‎-255..255
    const c = contrast / 100;                          // ‎-1..1
    const cf = (1 + c) / (1 - Math.min(c, 0.99));      // معامل التباين
    const s = saturation / 100;                        // ‎-1..1
    for (let i = 0; i < d.length; i += 4) {
      let r = d[i], g = d[i + 1], bl = d[i + 2];
      // سطوع
      r += b; g += b; bl += b;
      // تباين حوالين 128
      r = (r - 128) * cf + 128;
      g = (g - 128) * cf + 128;
      bl = (bl - 128) * cf + 128;
      // تشبع حسب الإضاءة
      const lum = 0.2126 * r + 0.7152 * g + 0.0722 * bl;
      r = lum + (r - lum) * (1 + s);
      g = lum + (g - lum) * (1 + s);
      bl = lum + (bl - lum) * (1 + s);
      d[i] = clamp(r); d[i + 1] = clamp(g); d[i + 2] = clamp(bl);
    }
    return out;
  }

  function grayscale(img) {
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const lum = 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
      d[i] = d[i + 1] = d[i + 2] = lum;
    }
    return img;
  }

  function invert(img) {
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      d[i] = 255 - d[i];
      d[i + 1] = 255 - d[i + 1];
      d[i + 2] = 255 - d[i + 2];
    }
    return img;
  }

  function sepia(img) {
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i + 1], b = d[i + 2];
      d[i]     = clamp(0.393 * r + 0.769 * g + 0.189 * b);
      d[i + 1] = clamp(0.349 * r + 0.686 * g + 0.168 * b);
      d[i + 2] = clamp(0.272 * r + 0.534 * g + 0.131 * b);
    }
    return img;
  }

  /* التفاف (convolution) عام بمصفوفة kernel */
  function convolve(img, kernel, divisor) {
    const w = img.width, h = img.height;
    const src = img.data;
    const out = new ImageData(new Uint8ClampedArray(src), w, h);
    const dst = out.data;
    const k = kernel.length, half = Math.floor(k / 2);
    divisor = divisor || 1;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let r = 0, g = 0, b = 0;
        for (let ky = 0; ky < k; ky++) {
          for (let kx = 0; kx < k; kx++) {
            const px = Math.min(w - 1, Math.max(0, x + kx - half));
            const py = Math.min(h - 1, Math.max(0, y + ky - half));
            const idx = (py * w + px) * 4;
            const weight = kernel[ky][kx];
            r += src[idx] * weight;
            g += src[idx + 1] * weight;
            b += src[idx + 2] * weight;
          }
        }
        const i = (y * w + x) * 4;
        dst[i] = clamp(r / divisor);
        dst[i + 1] = clamp(g / divisor);
        dst[i + 2] = clamp(b / divisor);
      }
    }
    return out;
  }

  function blur(img) {
    return convolve(img, [
      [1, 2, 1],
      [2, 4, 2],
      [1, 2, 1]
    ], 16);
  }

  function sharpen(img) {
    return convolve(img, [
      [0, -1, 0],
      [-1, 5, -1],
      [0, -1, 0]
    ], 1);
  }

  window.PSFilters = { adjust, grayscale, invert, sepia, blur, sharpen, convolve };
})();

</script>
<script>
/* بيكسل ستوديو — سجل التراجع والإعادة (كود أصلي) */
(function () {
  "use strict";

  /* لقطة كاملة للمستند: مقاسه + الطبقات كصور dataURL + خصائصها */
  function snapshot(state) {
    return {
      docW: state.docW,
      docH: state.docH,
      activeId: state.activeId,
      layers: state.layers.map((l) => ({
        id: l.id,
        name: l.name,
        x: l.x,
        y: l.y,
        visible: l.visible,
        opacity: l.opacity,
        blend: l.blend || "source-over",
        dataURL: l.canvas.toDataURL("image/png")
      }))
    };
  }

  /* استرجاع لقطة: بيرجّع Promise لأن تحميل الصور غير متزامن */
  function restore(state, snap) {
    return Promise.all(snap.layers.map((sl) => new Promise((res) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext("2d").drawImage(img, 0, 0);
        res({
          id: sl.id, name: sl.name, x: sl.x, y: sl.y,
          visible: sl.visible, opacity: sl.opacity,
          blend: sl.blend || "source-over", canvas
        });
      };
      img.onerror = () => res(null);
      img.src = sl.dataURL;
    }))).then((layers) => {
      state.docW = snap.docW;
      state.docH = snap.docH;
      state.layers = layers.filter(Boolean);
      state.activeId = snap.activeId;
      if (!state.layers.some((l) => l.id === state.activeId) && state.layers.length) {
        state.activeId = state.layers[state.layers.length - 1].id;
      }
    });
  }

  const MAX = 25;

  function pushHistory(state) {
    state.history.push(snapshot(state));
    if (state.history.length > MAX) state.history.shift();
    state.future.length = 0;
  }

  function undo(state) {
    if (!state.history.length) return null;
    const prev = state.history.pop();
    state.future.push(snapshot(state));
    return prev;
  }

  function redo(state) {
    if (!state.future.length) return null;
    const next = state.future.pop();
    state.history.push(snapshot(state));
    return next;
  }

  window.PSHistory = { snapshot, restore, pushHistory, undo, redo };
})();

</script>
<script>
/* بيكسل ستوديو — إدارة الطبقات ولوحتها (كود أصلي) */
(function () {
  "use strict";

  let counter = 0;

  function makeLayer(state, name, w, h) {
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const layer = {
      id: "layer-" + (++counter),
      name: name || ("طبقة " + counter),
      x: 0, y: 0,
      visible: true,
      opacity: 1,
      blend: "source-over",
      canvas
    };
    state.layers.push(layer);
    return layer;
  }

  function activeLayer(state) {
    return state.layers.find((l) => l.id === state.activeId) || null;
  }

  function addLayer(state, name) {
    window.PSHistory.pushHistory(state);
    const layer = makeLayer(state, name, state.docW, state.docH);
    state.activeId = layer.id;
    return layer;
  }

  function deleteLayer(state) {
    if (state.layers.length <= 1) return false;
    const idx = state.layers.findIndex((l) => l.id === state.activeId);
    if (idx < 0) return false;
    window.PSHistory.pushHistory(state);
    state.layers.splice(idx, 1);
    state.activeId = state.layers[Math.min(idx, state.layers.length - 1)].id;
    return true;
  }

  function duplicateLayer(state) {
    const src = activeLayer(state);
    if (!src) return null;
    window.PSHistory.pushHistory(state);
    const copy = makeLayer(state, src.name + " نسخة", src.canvas.width, src.canvas.height);
    copy.canvas.getContext("2d").drawImage(src.canvas, 0, 0);
    copy.x = src.x; copy.y = src.y;
    copy.opacity = src.opacity; copy.blend = src.blend;
    // حط النسخة فوق الأصل مباشرة
    state.layers.splice(state.layers.indexOf(copy), 1);
    const idx = state.layers.indexOf(src);
    state.layers.splice(idx + 1, 0, copy);
    state.activeId = copy.id;
    return copy;
  }

  function moveLayer(state, dir /* +1 لفوق في الليستة = آخر المصفوفة */) {
    const idx = state.layers.findIndex((l) => l.id === state.activeId);
    const to = idx + dir;
    if (idx < 0 || to < 0 || to >= state.layers.length) return false;
    window.PSHistory.pushHistory(state);
    const [l] = state.layers.splice(idx, 1);
    state.layers.splice(to, 0, l);
    return true;
  }

  function mergeDown(state) {
    const idx = state.layers.findIndex((l) => l.id === state.activeId);
    if (idx <= 0) return false;
    window.PSHistory.pushHistory(state);
    const top = state.layers[idx];
    const below = state.layers[idx - 1];
    const bctx = below.canvas.getContext("2d");
    bctx.save();
    bctx.globalAlpha = top.opacity;
    bctx.globalCompositeOperation = top.blend || "source-over";
    bctx.drawImage(top.canvas, top.x - below.x, top.y - below.y);
    bctx.restore();
    state.layers.splice(idx, 1);
    state.activeId = below.id;
    return true;
  }

  /* لوحة الطبقات في الواجهة: الأعلى في الليستة هو آخر عنصر في المصفوفة */
  function rebuildLayerList(state, render) {
    const list = document.getElementById("layerList");
    list.innerHTML = "";
    for (let i = state.layers.length - 1; i >= 0; i--) {
      const layer = state.layers[i];
      const li = document.createElement("li");
      li.className = "layer-item" + (layer.id === state.activeId ? " active" : "");
      li.dataset.layerId = layer.id;

      const thumb = document.createElement("span");
      thumb.className = "thumb";
      const tc = document.createElement("canvas");
      tc.width = layer.canvas.width; tc.height = layer.canvas.height;
      tc.getContext("2d").drawImage(layer.canvas, 0, 0);
      thumb.appendChild(tc);

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = layer.name;

      const vis = document.createElement("button");
      vis.className = "icon-btn";
      vis.title = "إظهار / إخفاء";
      vis.textContent = layer.visible ? "👁" : "🚫";
      vis.addEventListener("click", (e) => {
        e.stopPropagation();
        layer.visible = !layer.visible;
        rebuildLayerList(state, render);
        render();
      });

      const op = document.createElement("input");
      op.type = "range"; op.min = 0; op.max = 100; op.value = Math.round(layer.opacity * 100);
      op.title = "شفافية الطبقة";
      op.addEventListener("input", (e) => {
        e.stopPropagation();
        layer.opacity = e.target.value / 100;
        render();
      });
      op.addEventListener("click", (e) => e.stopPropagation());

      const up = document.createElement("button");
      up.className = "icon-btn"; up.title = "طلّعها لفوق"; up.textContent = "▲";
      up.addEventListener("click", (e) => {
        e.stopPropagation();
        const prev = state.activeId;
        state.activeId = layer.id;
        if (moveLayer(state, +1)) { rebuildLayerList(state, render); render(); }
        else state.activeId = prev;
      });

      const down = document.createElement("button");
      down.className = "icon-btn"; down.title = "نزّلها لتحت"; down.textContent = "▼";
      down.addEventListener("click", (e) => {
        e.stopPropagation();
        const prev = state.activeId;
        state.activeId = layer.id;
        if (moveLayer(state, -1)) { rebuildLayerList(state, render); render(); }
        else state.activeId = prev;
      });

      li.append(thumb, name, op, up, down, vis);
      li.addEventListener("click", () => {
        state.activeId = layer.id;
        rebuildLayerList(state, render);
        render();
      });
      list.appendChild(li);
    }
    const blend = document.getElementById("blendMode");
    const al = activeLayer(state);
    if (blend && al) blend.value = al.blend || "source-over";
  }

  window.PSLayers = {
    makeLayer, activeLayer, addLayer, deleteLayer,
    duplicateLayer, moveLayer, mergeDown, rebuildLayerList
  };
})();

<script>
/* بيكسل ستوديو — أدوات الرسم والتحديد (كود أصلي) */
(function () {
  "use strict";

  function hexToRgb(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex);
    if (!m) return [0, 0, 0];
    const n = parseInt(m[1], 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function colorDist(d, i, r, g, b) {
    return Math.abs(d[i] - r) + Math.abs(d[i + 1] - g) + Math.abs(d[i + 2] - b);
  }

  /* حدود قناع التحديد */
  function maskBounds(mask, w, h) {
    let minX = w, minY = h, maxX = -1, maxY = -1;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (mask[y * w + x]) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return null;
    return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
  }

  function rectMask(w, h, r) {
    const mask = new Uint8Array(w * h);
    const x0 = Math.max(0, Math.round(Math.min(r.x, r.x + r.w)));
    const y0 = Math.max(0, Math.round(Math.min(r.y, r.y + r.h)));
    const x1 = Math.min(w, Math.round(Math.max(r.x, r.x + r.w)));
    const y1 = Math.min(h, Math.round(Math.max(r.y, r.y + r.h)));
    for (let y = y0; y < y1; y++)
      for (let x = x0; x < x1; x++) mask[y * w + x] = 1;
    return mask;
  }

  /* العصا السحرية: تحديد المنطقة المتصلة القريبة في اللون من نقطة الضغط (على الطبقة المحددة) */
  function wandMask(layer, docW, docH, x, y, tol) {
    const lx = Math.floor(x - layer.x), ly = Math.floor(y - layer.y);
    const cw = layer.canvas.width, ch = layer.canvas.height;
    if (lx < 0 || ly < 0 || lx >= cw || ly >= ch) return null;
    const ctx = layer.canvas.getContext("2d");
    const img = ctx.getImageData(0, 0, cw, ch);
    const d = img.data;
    const si = (ly * cw + lx) * 4;
    const r0 = d[si], g0 = d[si + 1], b0 = d[si + 2], a0 = d[si + 3];
    const visited = new Uint8Array(cw * ch);
    const mask = new Uint8Array(docW * docH);
    const stack = [ly * cw + lx];
    visited[ly * cw + lx] = 1;
    while (stack.length) {
      const p = stack.pop();
      const px = p % cw, py = (p - px) / cw;
      const i = p * 4;
      if (colorDist(d, i, r0, g0, b0) <= tol * 3 && Math.abs(d[i + 3] - a0) <= tol) {
        const dx = px + layer.x, dy = py + layer.y;
        if (dx >= 0 && dy >= 0 && dx < docW && dy < docH) mask[dy * docW + dx] = 1;
        if (px > 0 && !visited[p - 1]) { visited[p - 1] = 1; stack.push(p - 1); }
        if (px < cw - 1 && !visited[p + 1]) { visited[p + 1] = 1; stack.push(p + 1); }
        if (py > 0 && !visited[p - cw]) { visited[p - cw] = 1; stack.push(p - cw); }
        if (py < ch - 1 && !visited[p + cw]) { visited[p + cw] = 1; stack.push(p + cw); }
      }
    }
    return mask;
  }

  /* التعبئة: تلوين المنطقة المتصلة القريبة في اللون (داخل الطبقة المحددة) */
  function fillBucket(layer, x, y, hex, tol) {
    const lx = Math.floor(x - layer.x), ly = Math.floor(y - layer.y);
    const cw = layer.canvas.width, ch = layer.canvas.height;
    if (lx < 0 || ly < 0 || lx >= cw || ly >= ch) return false;
    const ctx = layer.canvas.getContext("2d");
    const img = ctx.getImageData(0, 0, cw, ch);
    const d = img.data;
    const si = (ly * cw + lx) * 4;
    const r0 = d[si], g0 = d[si + 1], b0 = d[si + 2], a0 = d[si + 3];
    const [r, g, b] = hexToRgb(hex);
    if (r === r0 && g === g0 && b === b0 && a0 === 255) return false;
    const visited = new Uint8Array(cw * ch);
    const stack = [ly * cw + lx];
    visited[ly * cw + lx] = 1;
    while (stack.length) {
      const p = stack.pop();
      const px = p % cw, py = (p - px) / cw;
      const i = p * 4;
      if (colorDist(d, i, r0, g0, b0) <= tol * 3 && Math.abs(d[i + 3] - a0) <= tol) {
        d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
        if (px > 0 && !visited[p - 1]) { visited[p - 1] = 1; stack.push(p - 1); }
        if (px < cw - 1 && !visited[p + 1]) { visited[p + 1] = 1; stack.push(p + 1); }
        if (py > 0 && !visited[p - cw]) { visited[p - cw] = 1; stack.push(p - cw); }
        if (py < ch - 1 && !visited[p + cw]) { visited[p + cw] = 1; stack.push(p + cw); }
      }
    }
    ctx.putImageData(img, 0, 0);
    return true;
  }

  /* دمج نتيجة عملية مع ما قبلها حسب قناع التحديد (القناع بمقاس المستند) */
  function mergeByMask(layer, before, mask, docW, docH) {
    const ctx = layer.canvas.getContext("2d");
    const cw = layer.canvas.width, ch = layer.canvas.height;
    const after = ctx.getImageData(0, 0, cw, ch);
    const a = after.data, b = before.data;
    for (let ly = 0; ly < ch; ly++) {
      const dy = ly + layer.y;
      for (let lx = 0; lx < cw; lx++) {
        const dx = lx + layer.x;
        const inSel = dx >= 0 && dy >= 0 && dx < docW && dy < docH && mask[dy * docW + dx];
        if (!inSel) {
          const i = (ly * cw + lx) * 4;
          a[i] = b[i]; a[i + 1] = b[i + 1]; a[i + 2] = b[i + 2]; a[i + 3] = b[i + 3];
        }
      }
    }
    ctx.putImageData(after, 0, 0);
  }

  /* مسح البيكسلات المحددة (Delete) */
  function clearSelection(layer, mask, docW, docH) {
    const ctx = layer.canvas.getContext("2d");
    const cw = layer.canvas.width, ch = layer.canvas.height;
    const img = ctx.getImageData(0, 0, cw, ch);
    const d = img.data;
    let touched = false;
    for (let ly = 0; ly < ch; ly++) {
      const dy = ly + layer.y;
      if (dy < 0 || dy >= docH) continue;
      for (let lx = 0; lx < cw; lx++) {
        const dx = lx + layer.x;
        if (dx < 0 || dx >= docW) continue;
        if (mask[dy * docW + dx]) {
          const i = (ly * cw + lx) * 4;
          if (d[i + 3] !== 0) { d[i] = d[i + 1] = d[i + 2] = d[i + 3] = 0; touched = true; }
        }
      }
    }
    if (touched) ctx.putImageData(img, 0, 0);
    return touched;
  }

  /* التقاط لون من الصورة المجمّعة */
  function pickColor(comp, x, y) {
    const px = Math.floor(x), py = Math.floor(y);
    if (px < 0 || py < 0 || px >= comp.width || py >= comp.height) return null;
    const d = comp.getContext("2d").getImageData(px, py, 1, 1).data;
    const hex = "#" + [d[0], d[1], d[2]].map((v) => v.toString(16).padStart(2, "0")).join("");
    return hex;
  }

  /* رسم تدرج خطي من اللون للشفاف على الطبقة المحددة */
  function drawGradient(layer, x0, y0, x1, y1, hex) {
    const ctx = layer.canvas.getContext("2d");
    const [r, g, b] = hexToRgb(hex);
    const grad = ctx.createLinearGradient(x0 - layer.x, y0 - layer.y, x1 - layer.x, y1 - layer.y);
    grad.addColorStop(0, `rgba(${r},${g},${b},1)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.save();
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, layer.canvas.width, layer.canvas.height);
    ctx.restore();
  }

  window.PSTools = {
    hexToRgb, maskBounds, rectMask, wandMask, fillBucket,
    mergeByMask, clearSelection, pickColor, drawGradient
  };
})();

</script>
<script>
/* بيكسل ستوديو — التطبيق الرئيسي (كود أصلي) */
(function () {
  "use strict";

  const H = window.PSHistory;
  const L = window.PSLayers;
  const T = window.PSTools;
  const F = window.PSFilters;

  const state = {
    docW: 900, docH: 600,
    layers: [], activeId: null,
    tool: "move",
    color: "#e63946",
    brushSize: 14, fontSize: 42, tolerance: 32,
    zoom: 1,
    history: [], future: [],
    selection: null,      // {mask, bounds, isRect}
    drawing: false,
    last: null, start: null,
    preOpCanvas: null,    // لقطة الطبقة قبل الشكل/التدرج
    strokeBefore: null,   // ImageData قبل الضربة عشان قناع التحديد
    strokeClipApplied: false,
    cropRect: null,
    adjBase: null
  };

  const $ = (id) => document.getElementById(id);
  const canvas = $("canvas");
  const vctx = canvas.getContext("2d");
  const comp = document.createElement("canvas");
  const cctx = comp.getContext("2d");

  /* ---------- العرض ---------- */
  function render() {
    canvas.width = state.docW;
    canvas.height = state.docH;
    canvas.style.width = state.docW * state.zoom + "px";
    canvas.style.height = state.docH * state.zoom + "px";

    comp.width = state.docW;
    comp.height = state.docH;
    cctx.clearRect(0, 0, state.docW, state.docH);
    for (const layer of state.layers) {
      if (!layer.visible) continue;
      cctx.globalAlpha = layer.opacity;
      cctx.globalCompositeOperation = layer.blend || "source-over";
      cctx.drawImage(layer.canvas, layer.x, layer.y);
    }
    cctx.globalAlpha = 1;
    cctx.globalCompositeOperation = "source-over";

    vctx.clearRect(0, 0, state.docW, state.docH);
    vctx.drawImage(comp, 0, 0);

    if (state.selection && state.selection.bounds && state.selection.isRect) {
      const b = state.selection.bounds;
      vctx.save();
      vctx.setLineDash([6, 4]);
      vctx.lineWidth = 1.5;
      vctx.strokeStyle = "#ffffff";
      vctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w, b.h);
      vctx.strokeStyle = "#111111";
      vctx.setLineDash([4, 6]);
      vctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w, b.h);
      vctx.restore();
      $("selHint").classList.remove("hidden");
    } else {
      $("selHint").classList.add("hidden");
    }

    if(window.PSX && window.PSX.overlay) window.PSX.overlay(vctx);
    $("zoomLabel").textContent = Math.round(state.zoom * 100) + "%";
    $("docInfo").textContent = state.docW + " × " + state.docH + " • طبقات: " + state.layers.length;
    $("btnUndo").disabled = !state.history.length;
    $("btnRedo").disabled = !state.future.length;
  }

  function refreshAll() {
    L.rebuildLayerList(state, render);
    render();
  }

  function activeLayer() { return L.activeLayer(state); }

  /* ---------- مستند جديد ---------- */
  function newDocument(w, h) {
    state.docW = w; state.docH = h;
    state.layers = [];
    state.history = []; state.future = [];
    state.selection = null; state.cropRect = null; state.adjBase = null;
    const bg = L.makeLayer(state, "خلفية", w, h);
    const bctx = bg.canvas.getContext("2d");
    bctx.fillStyle = "#ffffff";
    bctx.fillRect(0, 0, w, h);
    state.activeId = bg.id;
    hideCropUI();
    refreshAll();
  }

  /* ---------- إحداثيات الماوس ---------- */
  function toDoc(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (state.docW / rect.width),
      y: (e.clientY - rect.top) * (state.docH / rect.height)
    };
  }

  /* ---------- التحديد ---------- */
  function setSelection(mask) {
    if (!mask) { state.selection = null; render(); return; }
    const bounds = T.maskBounds(mask, state.docW, state.docH);
    state.selection = bounds ? { mask, bounds, isRect: false } : null;
    render();
  }
  function clearSelection() { state.selection = null; render(); }

  function deleteSelectionContent() {
    const layer = activeLayer();
    if (!layer || !state.selection) return;
    H.pushHistory(state);
    if (T.clearSelection(layer, state.selection.mask, state.docW, state.docH)) refreshAll();
  }

  /* لقطة طبقة احتياطية للمعاينة */
  function snapshotLayerCanvas(layer) {
    const c = document.createElement("canvas");
    c.width = layer.canvas.width; c.height = layer.canvas.height;
    c.getContext("2d").drawImage(layer.canvas, 0, 0);
    return c;
  }

  /* تحديد مستطيل كـ clip حي أثناء الرسم */
  function clipIfRectSelection(ctx) {
    if (state.selection && state.selection.isRect) {
      const b = state.selection.bounds;
      const layer = activeLayer();
      ctx.save();
      ctx.beginPath();
      ctx.rect(b.x - layer.x, b.y - layer.y, b.w, b.h);
      ctx.clip();
      return true;
    }
    return false;
  }

  function finishMaskedOp(layer, before) {
    if (state.selection && !state.strokeClipApplied) {
      T.mergeByMask(layer, before, state.selection.mask, state.docW, state.docH);
    }
    state.strokeBefore = null;
    state.strokeClipApplied = false;
  }

  /* ---------- أحداث الرسم ---------- */
  function onPointerDown(e) {
    const p = toDoc(e);
    const layer = activeLayer();
    if (!layer) return;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* أحداث اصطناعية */ }
    state.start = p; state.last = p;

    switch (state.tool) {
      case "move":
        state.drawing = true;
        H.pushHistory(state);
        break;

      case "brush":
      case "eraser": {
        state.drawing = true;
        H.pushHistory(state);
        const ctx = layer.canvas.getContext("2d");
        state.strokeBefore = ctx.getImageData(0, 0, layer.canvas.width, layer.canvas.height);
        drawSegment(ctx, layer, p, p);
        break;
      }

      case "line": case "rect": case "ellipse": case "gradient":
        state.drawing = true;
        H.pushHistory(state);
        state.strokeBefore = layer.canvas.getContext("2d")
          .getImageData(0, 0, layer.canvas.width, layer.canvas.height);
        state.preOpCanvas = snapshotLayerCanvas(layer);
        break;

      case "fill": {
        H.pushHistory(state);
        const before = layer.canvas.getContext("2d")
          .getImageData(0, 0, layer.canvas.width, layer.canvas.height);
        if (T.fillBucket(layer, p.x, p.y, state.color, state.tolerance)) {
          finishMaskedOp(layer, before);
          refreshAll();
        } else {
          state.history.pop();
        }
        break;
      }

      case "picker": {
        if(e.altKey) break;
        const hex = T.pickColor(comp, p.x, p.y);
        if (hex) { state.color = hex; $("optColor").value = hex; }
        break;
      }

      case "select":
        state.drawing = true;
        break;

      case "wand": {
        const mask = T.wandMask(layer, state.docW, state.docH, p.x, p.y, state.tolerance);
        setSelection(mask);
        break;
      }

      case "crop":
        state.drawing = true;
        state.cropRect = { x: p.x, y: p.y, w: 0, h: 0 };
        break;

      case "text":
        openTextOverlay(p);
        break;
    }
  }

  function drawSegment(ctx, layer, from, to) {
    ctx.save();
    ctx.translate(-layer.x, -layer.y);
    let clipped = false;
    if (state.selection && state.selection.isRect) {
      ctx.restore();
      clipped = clipIfRectSelection(ctx);
      ctx.translate(-layer.x, -layer.y);
      state.strokeClipApplied = true;
    }
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = state.brushSize;
    if (state.tool === "eraser") {
      ctx.globalCompositeOperation = "destination-out";
      ctx.strokeStyle = "rgba(0,0,0,1)";
    } else {
      ctx.strokeStyle = state.color;
    }
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
    ctx.restore();
  }

  function drawShape(layer, from, to) {
    const ctx = layer.canvas.getContext("2d");
    ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
    ctx.drawImage(state.preOpCanvas, 0, 0);
    ctx.save();
    ctx.translate(-layer.x, -layer.y);
    ctx.strokeStyle = state.color;
    ctx.fillStyle = state.color;
    ctx.lineWidth = state.brushSize;
    ctx.lineCap = "round";
    const w = to.x - from.x, h = to.y - from.y;
    if (state.tool === "line") {
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
    } else if (state.tool === "rect") {
      if ($("optShapeFill").checked) ctx.fillRect(from.x, from.y, w, h);
      else ctx.strokeRect(from.x, from.y, w, h);
    } else if (state.tool === "ellipse") {
      ctx.beginPath();
      ctx.ellipse(from.x + w / 2, from.y + h / 2, Math.abs(w / 2), Math.abs(h / 2), 0, 0, Math.PI * 2);
      if ($("optShapeFill").checked) ctx.fill(); else ctx.stroke();
    } else if (state.tool === "gradient") {
      T.drawGradient(layer, from.x, from.y, to.x, to.y, state.color);
    }
    ctx.restore();
  }

  function onPointerMove(e) {
    if (!state.drawing) return;
    const p = toDoc(e);
    const layer = activeLayer();
    if (!layer) return;

    switch (state.tool) {
      case "move":
        layer.x = Math.round(layer.x + p.x - state.last.x);
        layer.y = Math.round(layer.y + p.y - state.last.y);
        render();
        break;
      case "brush": case "eraser":
        drawSegment(layer.canvas.getContext("2d"), layer, state.last, p);
        render();
        break;
      case "line": case "rect": case "ellipse": case "gradient":
        drawShape(layer, state.start, p);
        render();
        break;
      case "select": {
        const r = { x: state.start.x, y: state.start.y, w: p.x - state.start.x, h: p.y - state.start.y };
        const mask = T.rectMask(state.docW, state.docH, r);
        const bounds = T.maskBounds(mask, state.docW, state.docH);
        state.selection = bounds ? { mask, bounds, isRect: true } : null;
        render();
        break;
      }
      case "crop":
        state.cropRect = { x: state.start.x, y: state.start.y, w: p.x - state.start.x, h: p.y - state.start.y };
        showCropUI();
        break;
    }
    state.last = p;
  }

  function onPointerUp() {
    if (!state.drawing) { state.start = null; return; }
    state.drawing = false;
    const layer = activeLayer();

    if ((state.tool === "brush" || state.tool === "eraser" ||
         state.tool === "line" || state.tool === "rect" ||
         state.tool === "ellipse" || state.tool === "gradient") && layer && state.strokeBefore) {
      finishMaskedOp(layer, state.strokeBefore);
      state.preOpCanvas = null;
      refreshAll();
    }
    if (state.tool === "move") refreshAll();
    if (state.tool === "select" && state.start && state.last &&
        Math.abs(state.last.x - state.start.x) < 2 && Math.abs(state.last.y - state.start.y) < 2) {
      clearSelection();
    }
    state.start = null; state.last = null;
  }

  /* ---------- النص ---------- */
  function openTextOverlay(p) {
    const overlay = $("textOverlay");
    overlay.classList.remove("hidden");
    overlay.style.left = p.x * state.zoom + "px";
    overlay.style.top = p.y * state.zoom + "px";
    overlay.style.fontSize = Math.max(13, state.fontSize * state.zoom * 0.6) + "px";
    overlay.value = "";
    overlay.dataset.docX = p.x; overlay.dataset.docY = p.y;
    setTimeout(() => overlay.focus(), 0);
  }

  function commitText() {
    const overlay = $("textOverlay");
    const text = overlay.value.trim();
    overlay.classList.add("hidden");
    if (!text) return;
    const layer = activeLayer();
    if (!layer) return;
    H.pushHistory(state);
    const ctx = layer.canvas.getContext("2d");
    ctx.save();
    ctx.translate(-layer.x, -layer.y);
    ctx.font = window.PSX ? window.PSX.fontCSS(state.fontSize) : state.fontSize + 'px Arial';
    ctx.fillStyle = state.color;
    ctx.textBaseline = "top";
    ctx.fillText(text, parseFloat(overlay.dataset.docX), parseFloat(overlay.dataset.docY));
    ctx.restore();
    refreshAll();
  }

  /* ---------- القص ---------- */
  function showCropUI() {
    const r = normalizeRect(state.cropRect);
    const ov = $("cropOverlay");
    ov.classList.remove("hidden");
    ov.style.left = r.x * state.zoom + "px";
    ov.style.top = r.y * state.zoom + "px";
    ov.style.width = r.w * state.zoom + "px";
    ov.style.height = r.h * state.zoom + "px";
    $("btnApplyCrop").classList.remove("hidden");
  }
  function hideCropUI() {
    $("cropOverlay").classList.add("hidden");
    $("btnApplyCrop").classList.add("hidden");
    state.cropRect = null;
  }
  function normalizeRect(r) {
    return {
      x: Math.round(Math.min(r.x, r.x + r.w)),
      y: Math.round(Math.min(r.y, r.y + r.h)),
      w: Math.round(Math.abs(r.w)),
      h: Math.round(Math.abs(r.h))
    };
  }

  function applyCrop() {
    if (!state.cropRect) return;
    const r = normalizeRect(state.cropRect);
    if (r.w < 2 || r.h < 2) { hideCropUI(); return; }
    H.pushHistory(state);
    for (const layer of state.layers) {
      const c = document.createElement("canvas");
      c.width = r.w; c.height = r.h;
      c.getContext("2d").drawImage(layer.canvas, layer.x - r.x, layer.y - r.y);
      layer.canvas = c;
      layer.x = 0; layer.y = 0;
    }
    state.docW = r.w; state.docH = r.h;
    state.selection = null;
    hideCropUI();
    refreshAll();
  }

  /* ---------- الفلاتر ---------- */
  function applyFilter(name) {
    const layer = activeLayer();
    if (!layer) return;
    H.pushHistory(state);
    const ctx = layer.canvas.getContext("2d");
    const before = ctx.getImageData(0, 0, layer.canvas.width, layer.canvas.height);
    let img = ctx.getImageData(0, 0, layer.canvas.width, layer.canvas.height);
    img = F[name](img);
    ctx.putImageData(img, 0, 0);
    if (state.selection) T.mergeByMask(layer, before, state.selection.mask, state.docW, state.docH);
    refreshAll();
  }

  function onSliderInput() {
    const layer = activeLayer();
    if (!layer) return;
    const ctx = layer.canvas.getContext("2d");
    if (!state.adjBase) {
      H.pushHistory(state);
      state.adjBase = ctx.getImageData(0, 0, layer.canvas.width, layer.canvas.height);
      state.adjBaseLayerId = layer.id;
    }
    const b = +$("adjBrightness").value, c = +$("adjContrast").value, s = +$("adjSaturation").value;
    $("adjBrightnessV").textContent = b;
    $("adjContrastV").textContent = c;
    $("adjSaturationV").textContent = s;
    const out = F.adjust(state.adjBase, b, c, s);
    ctx.putImageData(out, 0, 0);
    if(state.selection) T.mergeByMask(layer,state.adjBase,state.selection.mask,state.docW,state.docH);
    render();
  }

  function resetSliders() {
    $("adjBrightness").value = 0; $("adjContrast").value = 0; $("adjSaturation").value = 0;
    $("adjBrightnessV").textContent = 0; $("adjContrastV").textContent = 0; $("adjSaturationV").textContent = 0;
  }

  function commitAdjustments() {
    state.adjBase = null;
    resetSliders();
    refreshAll();
  }

  function cancelAdjustments() {
    const layer = activeLayer();
    if (state.adjBase && layer && state.adjBaseLayerId === layer.id) {
      layer.canvas.getContext("2d").putImageData(state.adjBase, 0, 0);
    }
    state.adjBase = null;
    resetSliders();
    refreshAll();
  }

  /* ---------- فتح / تصدير ---------- */
  function openImageFile(file) {
    const img = new Image();
    img.onload = () => {
      H.pushHistory(state);
      const scale = Math.min(1, state.docW / img.naturalWidth, state.docH / img.naturalHeight);
      const w = Math.round(img.naturalWidth * scale);
      const h = Math.round(img.naturalHeight * scale);
      const layer = L.makeLayer(state, file.name.replace(/\.[^.]+$/, "") || "صورة", w, h);
      layer.canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      layer.x = Math.round((state.docW - w) / 2);
      layer.y = Math.round((state.docH - h) / 2);
      state.activeId = layer.id;
      refreshAll();
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
  }

  function exportDataURL(type) {
    const out = document.createElement("canvas");
    out.width = state.docW; out.height = state.docH;
    const octx = out.getContext("2d");
    if (type === "image/jpeg") { octx.fillStyle = "#ffffff"; octx.fillRect(0, 0, out.width, out.height); }
    for (const layer of state.layers) {
      if (!layer.visible) continue;
      octx.globalAlpha = layer.opacity;
      octx.globalCompositeOperation = layer.blend || "source-over";
      octx.drawImage(layer.canvas, layer.x, layer.y);
    }
    return out.toDataURL(type, 0.92);
  }

  function download(type, ext) {
    const a = document.createElement("a");
    a.href = exportDataURL(type);
    a.download = "pixel-studio." + ext;
    a.click();
  }

  /* ---------- زوم ---------- */
  function setZoom(z) {
    state.zoom = Math.min(8, Math.max(0.05, z));
    render();
    if (state.cropRect) showCropUI();
  }
  function zoomFit() {
    const area = $("canvasScroll");
    const z = Math.min(
      (area.clientWidth - 60) / state.docW,
      (area.clientHeight - 60) / state.docH
    );
    setZoom(Math.min(1, z));
  }

  /* ---------- تراجع / إعادة ---------- */
  function undo() {
    const snap = H.undo(state);
    if (!snap) return Promise.resolve(false);
    state.adjBase = null; resetSliders();
    return H.restore(state, snap).then(() => { state.selection = null; hideCropUI(); refreshAll(); return true; });
  }
  function redo() {
    const snap = H.redo(state);
    if (!snap) return Promise.resolve(false);
    state.adjBase = null; resetSliders();
    return H.restore(state, snap).then(() => { state.selection = null; hideCropUI(); refreshAll(); return true; });
  }

  /* ---------- اختيار الأداة ---------- */
  function setTool(tool) {
    state.tool = tool;
    document.querySelectorAll(".tool").forEach((b) => b.classList.toggle("active", b.dataset.tool === tool));
    $("optBrushWrap").classList.toggle("hidden", !(tool === "brush" || tool === "eraser" || tool === "line" || tool === "rect" || tool === "ellipse"));
    $("optFontWrap").classList.toggle("hidden", tool !== "text");
    $("optTolWrap").classList.toggle("hidden", !(tool === "wand" || tool === "fill"));
    $("optFillShape").classList.toggle("hidden", !(tool === "rect" || tool === "ellipse"));
    if (tool !== "crop") hideCropUI();
    canvas.style.cursor = tool === "move" ? "move" : tool === "text" ? "text" : "crosshair";
    if(window.PSX) window.PSX.onTool(tool);
  }

  /* ---------- ربط الواجهة ---------- */
  function bindUI() {
    document.querySelectorAll(".tool").forEach((b) =>
      b.addEventListener("click", () => setTool(b.dataset.tool)));

    $("optColor").addEventListener("input", (e) => { state.color = e.target.value; });
    $("optBrush").addEventListener("input", (e) => { state.brushSize = +e.target.value; $("brushSizeLabel").textContent = e.target.value; });
    $("optFont").addEventListener("input", (e) => { state.fontSize = +e.target.value; $("fontSizeLabel").textContent = e.target.value; });
    $("optTol").addEventListener("input", (e) => { state.tolerance = +e.target.value; $("tolLabel").textContent = e.target.value; });

    $("btnOpen").addEventListener("click", () => $("fileInput").click());
    $("fileInput").addEventListener("change", (e) => {
      if (e.target.files[0]) openImageFile(e.target.files[0]);
      e.target.value = "";
    });
    $("btnNew").addEventListener("click", () => {
      const input = window.prompt("مقاس المستند الجديد؟ (العرض × الارتفاع)", "900×600");
      if (!input) return;
      const m = /(\d+)\s*[×x*]\s*(\d+)/.exec(input);
      const w = m ? Math.min(4000, Math.max(50, +m[1])) : 900;
      const h = m ? Math.min(4000, Math.max(50, +m[2])) : 600;
      newDocument(w, h);
    });

    $("btnUndo").addEventListener("click", undo);
    $("btnRedo").addEventListener("click", redo);
    $("btnZoomIn").addEventListener("click", () => setZoom(state.zoom * 1.25));
    $("btnZoomOut").addEventListener("click", () => setZoom(state.zoom / 1.25));
    $("btnZoomFit").addEventListener("click", zoomFit);
    $("btnExportPng").addEventListener("click", () => download("image/png", "png"));
    $("btnExportJpg").addEventListener("click", () => download("image/jpeg", "jpg"));

    $("btnAddLayer").addEventListener("click", () => { L.addLayer(state); refreshAll(); });
    $("btnDelLayer").addEventListener("click", () => { L.deleteLayer(state); refreshAll(); });
    $("btnDupLayer").addEventListener("click", () => { L.duplicateLayer(state); refreshAll(); });
    $("btnMergeDown").addEventListener("click", () => { L.mergeDown(state); refreshAll(); });
    $("blendMode").addEventListener("change", (e) => {
      const layer = activeLayer();
      if (layer) { H.pushHistory(state); layer.blend = e.target.value; render(); }
    });

    document.querySelectorAll(".filter").forEach((b) =>
      b.addEventListener("click", () => applyFilter(b.dataset.filter)));
    ["adjBrightness", "adjContrast", "adjSaturation"].forEach((id) =>
      $(id).addEventListener("input", onSliderInput));
    $("btnApplyAdj").addEventListener("click", commitAdjustments);
    $("btnResetAdj").addEventListener("click", cancelAdjustments);

    $("btnApplyCrop").addEventListener("click", applyCrop);

    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointerleave", onPointerUp);

    $("textOverlay").addEventListener("keydown", (e) => {
      if (e.key === "Enter") commitText();
      if (e.key === "Escape") $("textOverlay").classList.add("hidden");
      e.stopPropagation();
    });

    document.addEventListener("keydown", (e) => {
      const typing = /INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName || "");
      if (typing || document.getElementById("dlgBack")) return;
      if(window.PSX && window.PSX.onKey(e)) return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
      else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === "y" || (e.shiftKey && e.key.toLowerCase() === "z"))) { e.preventDefault(); redo(); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "a") { e.preventDefault(); setSelection(T.rectMask(state.docW, state.docH, { x: 0, y: 0, w: state.docW, h: state.docH })); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "d") { e.preventDefault(); clearSelection(); }
      else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteSelectionContent(); }
      else {
        const keys = { v: "move", m: "select", w: "wand", c: "crop", i: "picker", b: "brush", e: "eraser", u: "rect", t: "text" };
        const tool = keys[e.key.toLowerCase()];
        if (tool && !e.ctrlKey && !e.metaKey) setTool(tool);
      }
    });
  }

  /* ---------- تشغيل ---------- */
  function init() {
    bindUI();
    newDocument(900, 600);
    setTool("move");
    setTimeout(zoomFit, 50);
  }

  /* واجهة برمجية للاختبارات */
  window.PS = {
    state, render, refreshAll, newDocument, setTool, undo, redo,
    applyFilter, commitAdjustments, cancelAdjustments, onSliderInput,
    applyCrop, cropRect: (r) => { state.cropRect = r; },
    setSelection: (r) => setSelection(T.rectMask(state.docW, state.docH, r)),
    clearSelection, deleteSelectionContent, exportDataURL,
    openImageFile, toDoc, activeLayer, comp, setSelectionMask:setSelection, setZoom, zoomFit, hideCropUI
  };

  init();
})();

</script>
<script>
/* بيكسل ستوديو — الإضافات الموسّعة: أدوات إضافية، قوائم، حوارات ضبط، مشاريع، فلاتر (كود أصلي) */
(function () {
  "use strict";

  const PS = window.PS, S = PS.state, H = window.PSHistory, L = window.PSLayers, T = window.PSTools, F = window.PSFilters;
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const c8 = (v) => (v < 0 ? 0 : v > 255 ? 255 : v);
  const canvas = $("canvas");
  S.bgColor = "#ffffff";

  const X = {
    opts: { hardness: 60, strength: 60, sides: 5, star: false, radius: 24, gradType: "linear", gradMode: "transparent", contiguous: true, sponge: "desat", font: "Segoe UI", bold: false, italic: false, grid: false, gridSize: 50 },
    clip: null, cloneSrc: null, poly: null, lasso: null, mouse: null, outlineCache: null
  };
  window.PSX = X;

  /* ============ أدوات مساعدة ============ */
  function newCanvas(w, h) { const c = document.createElement("canvas"); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; }
  function copyCanvas(src) { const c = newCanvas(src.width, src.height); c.getContext("2d").drawImage(src, 0, 0); return c; }
  function layerData(layer) { return layer.canvas.getContext("2d").getImageData(0, 0, layer.canvas.width, layer.canvas.height); }
  function cloneImg(img) { return new ImageData(new Uint8ClampedArray(img.data), img.width, img.height); }
  function hex2rgb(h) { return T.hexToRgb(h); }
  function rgb2hex(r, g, b) { return "#" + [r, g, b].map((v) => Math.round(c8(v)).toString(16).padStart(2, "0")).join(""); }
  function active() { return PS.activeLayer(); }
  function insertLayerAt(idx, layer) {
    const i = S.layers.indexOf(layer);
    if (i >= 0) S.layers.splice(i, 1);
    S.layers.splice(clamp(idx, 0, S.layers.length), 0, layer);
  }
  function fitAll() { PS.refreshAll(); }
  function toast(msg) {
    let t = $("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2200);
  }
  X.toast = toast;

  /* ============ أقنعة التحديد (تدعم تنعيم الحواف) ============ */
  /* 0 = خارج، 1 = داخل كامل، 2..255 = شفافية جزئية للتنعيم */
  const mAlpha = (v) => (v === 0 ? 0 : v === 1 ? 1 : (v - 1) / 254);
  const mEnc = (a) => (a <= 0.004 ? 0 : a >= 0.996 ? 1 : clamp(1 + Math.round(a * 254), 2, 255));
  X.mAlpha = mAlpha; X.mEnc = mEnc;

  T.mergeByMask = function (layer, before, mask, dw, dh) {
    const ctx = layer.canvas.getContext("2d");
    const cw = layer.canvas.width, ch = layer.canvas.height;
    const after = ctx.getImageData(0, 0, cw, ch);
    const a = after.data, b = before.data;
    for (let ly = 0; ly < ch; ly++) {
      const dy = ly + layer.y;
      for (let lx = 0; lx < cw; lx++) {
        const dx = lx + layer.x;
        const m = (dx >= 0 && dy >= 0 && dx < dw && dy < dh) ? mAlpha(mask[dy * dw + dx]) : 0;
        if (m >= 1) continue;
        const i = (ly * cw + lx) * 4;
        if (m <= 0) { a[i] = b[i]; a[i + 1] = b[i + 1]; a[i + 2] = b[i + 2]; a[i + 3] = b[i + 3]; }
        else { for (let k = 0; k < 4; k++) a[i + k] = b[i + k] + (a[i + k] - b[i + k]) * m; }
      }
    }
    ctx.putImageData(after, 0, 0);
  };

  T.clearSelection = function (layer, mask, dw, dh) {
    const ctx = layer.canvas.getContext("2d");
    const cw = layer.canvas.width, ch = layer.canvas.height;
    const img = ctx.getImageData(0, 0, cw, ch), d = img.data;
    let touched = false;
    for (let ly = 0; ly < ch; ly++) {
      const dy = ly + layer.y;
      if (dy < 0 || dy >= dh) continue;
      for (let lx = 0; lx < cw; lx++) {
        const dx = lx + layer.x;
        if (dx < 0 || dx >= dw) continue;
        const m = mAlpha(mask[dy * dw + dx]);
        if (m > 0) {
          const i = (ly * cw + lx) * 4;
          if (d[i + 3] !== 0) { d[i + 3] = m >= 1 ? 0 : d[i + 3] * (1 - m); if (m >= 1) d[i] = d[i + 1] = d[i + 2] = 0; touched = true; }
        }
      }
    }
    if (touched) ctx.putImageData(img, 0, 0);
    return touched;
  };

  function setMask(mask) { PS.setSelectionMask(mask); }
  function curMask() { return S.selection ? S.selection.mask : null; }
  function combineMasks(prev, cur, mode) {
    if (!prev || mode === "new") return cur;
    if (!cur) return mode === "sub" ? prev : prev;
    const out = new Uint8Array(prev.length);
    for (let i = 0; i < out.length; i++) {
      const a = mAlpha(prev[i]), b = mAlpha(cur[i]);
      const r = mode === "add" ? Math.max(a, b) : mode === "sub" ? a * (1 - b) : Math.min(a, b);
      out[i] = mEnc(r);
    }
    return out;
  }
  function maskFromDraw(drawFn) {
    const c = newCanvas(S.docW, S.docH), x = c.getContext("2d");
    x.fillStyle = "#000"; drawFn(x);
    const d = x.getImageData(0, 0, S.docW, S.docH).data;
    const m = new Uint8Array(S.docW * S.docH);
    for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] >= 128 ? 1 : 0;
    return m;
  }
  function selectionFrom(mask, mode) {
    const next = combineMasks(curMask(), mask, mode || "new");
    if (!next) { PS.clearSelection(); return; }
    setMask(next);
  }
  X.selectionFrom = selectionFrom;

  function invertSelection() {
    const n = S.docW * S.docH, m = new Uint8Array(n), cur = curMask();
    for (let i = 0; i < n; i++) m[i] = cur ? mEnc(1 - mAlpha(cur[i])) : 1;
    setMask(m);
    if (!S.selection) toast("التحديد بقى فاضي");
  }
  function morphMask(r, grow) {
    const cur = curMask(); if (!cur) return toast("مفيش تحديد");
    const w = S.docW, h = S.docH;
    let a = new Float32Array(w * h);
    for (let i = 0; i < a.length; i++) a[i] = mAlpha(cur[i]);
    const pass = (src, horiz) => {
      const out = new Float32Array(src.length);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        let v = grow ? 0 : 1;
        for (let k = -r; k <= r; k++) {
          const xx = horiz ? clamp(x + k, 0, w - 1) : x, yy = horiz ? y : clamp(y + k, 0, h - 1);
          const s = src[yy * w + xx];
          v = grow ? Math.max(v, s) : Math.min(v, s);
        }
        out[y * w + x] = v;
      }
      return out;
    };
    a = pass(pass(a, true), false);
    const m = new Uint8Array(w * h);
    for (let i = 0; i < m.length; i++) m[i] = mEnc(a[i]);
    setMask(m);
  }
  function featherMask(r) {
    const cur = curMask(); if (!cur) return toast("مفيش تحديد");
    const w = S.docW, h = S.docH;
    const img = new ImageData(w, h);
    for (let i = 0; i < w * h; i++) { img.data[i * 4 + 3] = Math.round(mAlpha(cur[i]) * 255); }
    const b = blurRGBA(img, r);
    const m = new Uint8Array(w * h);
    for (let i = 0; i < m.length; i++) m[i] = mEnc(b.data[i * 4 + 3] / 255);
    setMask(m);
  }
  function maskFromLayerAlpha() {
    const l = active(); if (!l) return;
    const d = layerData(l).data, m = new Uint8Array(S.docW * S.docH);
    for (let y = 0; y < l.canvas.height; y++) for (let x = 0; x < l.canvas.width; x++) {
      const dx = x + l.x, dy = y + l.y;
      if (dx < 0 || dy < 0 || dx >= S.docW || dy >= S.docH) continue;
      const a = d[(y * l.canvas.width + x) * 4 + 3];
      m[dy * S.docW + dx] = mEnc(a / 255);
    }
    setMask(m);
  }
  function colorRangeMask(hex, tol) {
    const [r, g, b] = hex2rgb(hex);
    const d = PS.comp.getContext("2d").getImageData(0, 0, S.docW, S.docH).data;
    const m = new Uint8Array(S.docW * S.docH);
    for (let i = 0; i < m.length; i++) {
      const dist = Math.abs(d[i * 4] - r) + Math.abs(d[i * 4 + 1] - g) + Math.abs(d[i * 4 + 2] - b);
      if (dist <= tol * 3 && d[i * 4 + 3] > 0) m[i] = 1;
    }
    return m;
  }

  /* مخطط حدود التحديد (بدل المستطيل المحيط) */

    setTimeout(() => {
      try {
        if (/[?&]test=1/.test(location.search)) runTests().catch(err=>{ const d=document.getElementById("testResults");d.classList.remove("hidden");d.textContent=results.join("\n")+"\nERROR "+err.stack; });
        else if (/[?&]demo=1/.test(location.search)) runDemo();
      } catch (err) {
        const div = document.getElementById("testResults");
        div.classList.remove("hidden");
        div.textContent = results.join("\n") + "\nERROR " + (err && err.message);
      }
    }, 300);
  });
})();

}
</script>
